[ConsoleVariables]

t.MaxFPS=40
r.VSync=0
r.OneFrameThreadLag=1
r.FinishCurrentFrame=0
r.CreateShadersOnLoad=1
r.Shaders.Optimize=1
r.GTSyncType=1

r.Streaming.PoolSize=250
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.UseFixedPoolSize=1

foliage.DensityScale=0
grass.DensityScale=0
grass.Enable=0
grass.DiscardDataOnLoad=1
r.Foliage.MinimumScreenSize=20
r.Foliage.LODDistanceScale=0.001

r.ShadowQuality=0
r.Shadow.MaxResolution=32
r.Shadow.DistanceScale=0
r.Shadow.CSM.MaxCascades=0
r.LightFunctionQuality=0
r.ContactShadows=0
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0
r.TrueSkyQuality=0
r.VolumetricFog=0
r.Fog=0
r.Atmosphere=0

r.PostProcessingQuality=0
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.LensFlare=0
r.DefaultFeature.DepthOfField=0
r.DefaultFeature.AntiAliasing=0
r.DefaultFeature.AmbientOcclusion=0
r.DefaultFeature.Bloom=0

r.ScreenPercentage=60
r.ViewDistanceScale=0.3
r.SkeletalMeshLODBias=3
r.StaticMeshLODDistanceScale=3.0
r.LandscapeLOD0DistributionScale=0.3
r.EmitterSpawnRateScale=0.0
r.ParticleLODBias=4
r.DetailMode=0
r.MaterialQualityLevel=0

[Core.System]
Paths=../../../Engine/Content
Paths=%GAMEDIR%Content
Paths=../../../Engine/Plugins/TrueSkyPlugin/Content
Paths=../../../StateOfDecay2/Plugins/Wwise/Content

[/Script/HardwareCaps.HardwareCapsConfig]
bHasCheckedMinspec=True

[WindowsApplication.Accessibility]
StickyKeysHotkey=False
ToggleKeysHotkey=False
FilterKeysHotkey=False
StickyKeysConfirmation=False
ToggleKeysConfirmation=False
FilterKeysConfirmation=False
